<!-- User Shopping Cart Page -->
<div class="row">
    <div class="col-12 grid-margin">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="font-weight-bold mb-1" style="color: #843800;">
                    <i class="ti-shopping-cart me-2"></i>My Shopping Cart
                </h4>
                <p class="text-muted mb-0">Manage selected thrift items and proceed to checkout.</p>
            </div>
            <a href="main.html?page=Dashboard" class="btn btn-outline-primary btn-sm">
                <i class="ti-arrow-left me-1"></i> Continue Shopping
            </a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-8 grid-margin stretch-card">
        <div class="card" style="border-radius: 14px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
            <div class="card-body">
                <div class="table-responsive border rounded-3 mb-3">
                    <table class="table align-middle mb-0" id="cartTable">
                        <thead class="bg-light">
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="cartTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                    Loading your cart items...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Card -->
    <div class="col-lg-4 grid-margin stretch-card">
        <div class="card" style="border-radius: 14px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
            <div class="card-body bg-light rounded-3 p-4">
                <h5 class="font-weight-bold border-bottom pb-2 mb-3">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Total Items:</span>
                    <span class="font-weight-bold" id="summaryTotalItems">0</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted">Total Amount:</span>
                    <span class="fs-20 font-weight-bold" style="color: #843800;" id="summaryTotalAmount">₱ 0.00</span>
                </div>

                <hr class="my-3">
                <h6 class="font-weight-bold mb-2" style="font-size: 13px;">Delivery & Payment</h6>

                <div class="mb-2">
                    <label class="form-label small mb-1">Full Name</label>
                    <input type="text" id="checkoutFullName" class="form-control form-control-sm" placeholder="Enter recipient name">
                </div>

                <div class="mb-2">
                    <label class="form-label small mb-1">Delivery Address<span class="text-danger">*</span></label>
                    <input type="text" id="checkoutAddress" class="form-control form-control-sm" placeholder="House #, Street, Barangay, City" required>
                </div>

                <div class="mb-2">
                    <label class="form-label small mb-1">Phone Number <span class="text-danger">*</span></label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light text-muted font-weight-bold" style="font-size: 13px;">+63</span>
                        <input type="tel" id="checkoutPhone" class="form-control form-control-sm" placeholder="9XXXXXXXXX" maxlength="10" autocomplete="tel" required>
                    </div>
                    <small class="text-muted" style="font-size: 11px;">10-digit mobile number starting with 9 (e.g. 9XXXXXXXXX)</small>
                </div>

                <div class="mb-3">
                    <label class="form-label small mb-1">Payment Method</label>
                    <select id="checkoutPaymentMethod" class="form-select form-select-sm">
                        <option value="GCash">GCash</option>
                        <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
                        <option value="Maya">Maya</option>
                    </select>
                </div>

                <button class="btn btn-primary w-100 py-2 font-weight-bold" id="checkoutBtn" style="background: #843800; border: none; border-radius: 8px;">
                    <i class="ti-check me-1"></i> Complete Checkout
                </button>
            </div>
        </div>
    </div>
</div>
